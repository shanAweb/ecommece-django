{% extends 'base.html' %}

{% block title %}Order Placed - Fleeto{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-5 text-center">
                    <div class="mb-3">
                        <i class="bi bi-check-circle-fill" style="font-size:48px;color:#27ae60"></i>
                    </div>
                    <h2 class="fw-bold">Thank you! Your order is confirmed.</h2>
                    <p class="text-muted">Order Number: <strong id="orderNumber">{{ order_number }}</strong></p>
                    <div class="mt-4">
                        <a href="/" class="btn btn-outline-secondary me-2">Continue Shopping</a>
                        <a href="/orders/" class="btn btn-primary">View Orders</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
