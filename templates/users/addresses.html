{% extends 'base.html' %}

{% block title %}My Addresses - Fleeto{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-3 mb-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div id="userAvatarContainer" style="width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; overflow: hidden; border: 3px solid #e74c3c; display: flex; align-items: center; justify-content: center; background: #f8f9fa;">
                        <i class="bi bi-person-circle" style="font-size: 5rem; color: #e74c3c;"></i>
                    </div>
                    <h5 class="mt-3 mb-1" id="userName">Loading...</h5>
                    <p class="text-muted small mb-0" id="userEmail">Loading...</p>
                </div>
            </div>
            
            <div class="list-group mt-4">
                <a href="/account/" class="list-group-item list-group-item-action">
                    <i class="bi bi-person me-2"></i>Profile
                </a>
                <a href="/orders/" class="list-group-item list-group-item-action">
                    <i class="bi bi-bag-check me-2"></i>My Orders
                </a>
                <a href="/wishlist/" class="list-group-item list-group-item-action">
                    <i class="bi bi-heart me-2"></i>Wishlist
                </a>
                <a href="/account/addresses/" class="list-group-item list-group-item-action active">
                    <i class="bi bi-geo-alt me-2"></i>Addresses
                </a>
                <a href="/account/settings/" class="list-group-item list-group-item-action">
                    <i class="bi bi-gear me-2"></i>Settings
                </a>
            </div>
        </div>
        
        <div class="col-lg-9">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">My Addresses</h4>
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addressModal" onclick="resetAddressForm()">
                        <i class="bi bi-plus-lg"></i> Add New Address
                    </button>
                </div>
                <div class="card-body" id="addressesContent">
                    <div class="text-center py-5">
                        <div class="spinner-border" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Address Modal -->
<div class="modal fade" id="addressModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addressModalTitle">Add New Address</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addressForm">
                    <input type="hidden" id="addressId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="fullName" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="phoneNumber" class="form-label">Phone Number <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="phoneNumber" required>
                        </div>
                        
                        <div class="col-md-12 mb-3">
                            <label for="addressLine1" class="form-label">Address Line 1 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="addressLine1" required>
                        </div>
                        
                        <div class="col-md-12 mb-3">
                            <label for="addressLine2" class="form-label">Address Line 2</label>
                            <input type="text" class="form-control" id="addressLine2">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="city" class="form-label">City <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="city" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="state" class="form-label">State/Province <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="state" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="postalCode" class="form-label">Postal Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="postalCode" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="country" class="form-label">Country <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="country" value="United States" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="addressType" class="form-label">Address Type <span class="text-danger">*</span></label>
                            <select class="form-select" id="addressType" required>
                                <option value="shipping">Shipping</option>
                                <option value="billing">Billing</option>
                                <option value="both">Both</option>
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <div class="form-check mt-4">
                                <input class="form-check-input" type="checkbox" id="isDefault">
                                <label class="form-check-label" for="isDefault">
                                    Set as default address
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="alert alert-danger d-none" id="addressErrorMessage"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveAddressBtn" onclick="saveAddress()">
                    <span class="spinner-border spinner-border-sm d-none" id="addressSpinner"></span>
                    Save Address
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/auth.js"></script>
<script>
    if (!Auth.isAuthenticated()) {
        window.location.href = '/login/';
    }

    // Load user data
    Auth.getUserData().then(data => {
        if (data) {
            document.getElementById('userName').textContent = data.full_name || data.email;
            document.getElementById('userEmail').textContent = data.email;
            
            // Display avatar if available
            const avatarContainer = document.getElementById('userAvatarContainer');
            if (data.avatar) {
                avatarContainer.innerHTML = `<img src="${data.avatar}" alt="Profile Picture" style="width: 100%; height: 100%; object-fit: cover;">`;
            }
        }
    });

    // Load addresses
    async function loadAddresses() {
        try {
            const response = await Auth.fetch('/api/users/addresses/');
            const data = await response.json();
            
            if (response.ok && data.length > 0) {
                displayAddresses(data);
            } else {
                document.getElementById('addressesContent').innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-geo-alt" style="font-size: 4rem; color: #ddd;"></i>
                        <p class="text-muted mt-3">No addresses saved yet</p>
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addressModal" onclick="resetAddressForm()">
                            <i class="bi bi-plus-lg"></i> Add Your First Address
                        </button>
                    </div>
                `;
            }
        } catch (error) {
            console.error('Error loading addresses:', error);
            document.getElementById('addressesContent').innerHTML = `
                <div class="alert alert-danger">Failed to load addresses. Please try again.</div>
            `;
        }
    }

    function displayAddresses(addresses) {
        const html = addresses.map(address => `
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1">
                                ${address.full_name}
                                ${address.is_default ? '<span class="badge bg-primary ms-2">Default</span>' : ''}
                            </h6>
                            <p class="text-muted small mb-2">
                                ${address.address_line1}${address.address_line2 ? ', ' + address.address_line2 : ''}<br>
                                ${address.city}, ${address.state} ${address.postal_code}<br>
                                ${address.country}<br>
                                Phone: ${address.phone_number}
                            </p>
                            <span class="badge bg-secondary">${address.address_type.charAt(0).toUpperCase() + address.address_type.slice(1)}</span>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-primary" onclick="editAddress(${address.id})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteAddress(${address.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
        
        document.getElementById('addressesContent').innerHTML = html;
    }

    function resetAddressForm() {
        document.getElementById('addressForm').reset();
        document.getElementById('addressId').value = '';
        document.getElementById('addressModalTitle').textContent = 'Add New Address';
        document.getElementById('addressErrorMessage').classList.add('d-none');
    }

    async function editAddress(id) {
        try {
            const response = await Auth.fetch(`/api/users/addresses/${id}/`);
            const address = await response.json();
            
            if (response.ok) {
                document.getElementById('addressId').value = address.id;
                document.getElementById('fullName').value = address.full_name;
                document.getElementById('phoneNumber').value = address.phone_number;
                document.getElementById('addressLine1').value = address.address_line1;
                document.getElementById('addressLine2').value = address.address_line2 || '';
                document.getElementById('city').value = address.city;
                document.getElementById('state').value = address.state;
                document.getElementById('postalCode').value = address.postal_code;
                document.getElementById('country').value = address.country;
                document.getElementById('addressType').value = address.address_type;
                document.getElementById('isDefault').checked = address.is_default;
                document.getElementById('addressModalTitle').textContent = 'Edit Address';
                
                const modal = new bootstrap.Modal(document.getElementById('addressModal'));
                modal.show();
            }
        } catch (error) {
            console.error('Error loading address:', error);
            alert('Failed to load address details.');
        }
    }

    async function saveAddress() {
        const saveBtn = document.getElementById('saveAddressBtn');
        const spinner = document.getElementById('addressSpinner');
        const errorMessage = document.getElementById('addressErrorMessage');
        
        saveBtn.disabled = true;
        spinner.classList.remove('d-none');
        errorMessage.classList.add('d-none');
        
        const addressId = document.getElementById('addressId').value;
        const isEdit = !!addressId;
        
        const addressData = {
            full_name: document.getElementById('fullName').value,
            phone_number: document.getElementById('phoneNumber').value,
            address_line1: document.getElementById('addressLine1').value,
            address_line2: document.getElementById('addressLine2').value,
            city: document.getElementById('city').value,
            state: document.getElementById('state').value,
            postal_code: document.getElementById('postalCode').value,
            country: document.getElementById('country').value,
            address_type: document.getElementById('addressType').value,
            is_default: document.getElementById('isDefault').checked
        };
        
        try {
            const url = isEdit ? `/api/users/addresses/${addressId}/` : '/api/users/addresses/';
            const method = isEdit ? 'PUT' : 'POST';
            
            const response = await Auth.fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(addressData)
            });
            
            if (response.ok) {
                const modal = bootstrap.Modal.getInstance(document.getElementById('addressModal'));
                modal.hide();
                loadAddresses();
            } else {
                const data = await response.json();
                errorMessage.textContent = data.error || 'Failed to save address. Please try again.';
                errorMessage.classList.remove('d-none');
            }
        } catch (error) {
            console.error('Error saving address:', error);
            errorMessage.textContent = 'An error occurred. Please try again.';
            errorMessage.classList.remove('d-none');
        } finally {
            saveBtn.disabled = false;
            spinner.classList.add('d-none');
        }
    }

    async function deleteAddress(id) {
        if (!confirm('Are you sure you want to delete this address?')) {
            return;
        }
        
        try {
            const response = await Auth.fetch(`/api/users/addresses/${id}/`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                loadAddresses();
            } else {
                alert('Failed to delete address. Please try again.');
            }
        } catch (error) {
            console.error('Error deleting address:', error);
            alert('An error occurred. Please try again.');
        }
    }

    // Load addresses on page load
    loadAddresses();
</script>
{% endblock %}
