{% extends 'base.html' %}

{% block title %}My Account - Fleeto{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-3 mb-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <div id="userAvatarContainer" style="width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; overflow: hidden; border: 3px solid #e74c3c; display: flex; align-items: center; justify-content: center; background: #f8f9fa;">
                        <i class="bi bi-person-circle" style="font-size: 5rem; color: #e74c3c;"></i>
                    </div>
                    <h5 class="mt-3 mb-1" id="userName">Loading...</h5>
                    <p class="text-muted small mb-0" id="userEmail">Loading...</p>
                </div>
            </div>
            
            <div class="list-group mt-4">
                <a href="/account/" class="list-group-item list-group-item-action active">
                    <i class="bi bi-person me-2"></i>Profile
                </a>
                <a href="/orders/" class="list-group-item list-group-item-action">
                    <i class="bi bi-bag-check me-2"></i>My Orders
                </a>
                <a href="/wishlist/" class="list-group-item list-group-item-action">
                    <i class="bi bi-heart me-2"></i>Wishlist
                </a>
                <a href="/account/addresses/" class="list-group-item list-group-item-action">
                    <i class="bi bi-geo-alt me-2"></i>Addresses
                </a>
                <a href="/account/settings/" class="list-group-item list-group-item-action">
                    <i class="bi bi-gear me-2"></i>Settings
                </a>
            </div>
        </div>
        
        <div class="col-lg-9">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0">My Profile</h4>
                </div>
                <div class="card-body" id="profileContent">
                    <div class="text-center py-5">
                        <div class="spinner-border" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/auth.js"></script>
<script>
    if (!Auth.isAuthenticated()) {
        window.location.href = '/login/';
    } else {
        // Load user profile
        Auth.getUserData().then(userData => {
            if (userData) {
                document.getElementById('userName').textContent = userData.full_name || userData.email;
                document.getElementById('userEmail').textContent = userData.email;
                
                // Display avatar if available
                const avatarContainer = document.getElementById('userAvatarContainer');
                if (userData.avatar) {
                    avatarContainer.innerHTML = `<img src="${userData.avatar}" alt="Profile Picture" style="width: 100%; height: 100%; object-fit: cover;">`;
                }
                
                document.getElementById('profileContent').innerHTML = `
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">First Name</label>
                            <p class="form-control-plaintext">${userData.first_name || 'N/A'}</p>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Last Name</label>
                            <p class="form-control-plaintext">${userData.last_name || 'N/A'}</p>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <p class="form-control-plaintext">${userData.email}</p>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Phone Number</label>
                            <p class="form-control-plaintext">${userData.phone_number || 'N/A'}</p>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Email Verified</label>
                            <p class="form-control-plaintext">
                                ${userData.is_email_verified ? '<span class="badge bg-success">Verified</span>' : '<span class="badge bg-warning">Not Verified</span>'}
                            </p>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Member Since</label>
                            <p class="form-control-plaintext">${new Date(userData.created_at).toLocaleDateString()}</p>
                        </div>
                    </div>
                    <hr>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" onclick="window.location.href='/account/edit/'">Edit Profile</button>
                        <button class="btn btn-outline-secondary" onclick="window.location.href='/account/change-password/'">Change Password</button>
                    </div>
                `;
            }
        });
    }
</script>
{% endblock %}
